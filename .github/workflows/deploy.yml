name: Deploy to EKS

on:
  workflow_run:
    workflows: ["Push to ECR"]
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install kubectl
        uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with:
          version: 'v1.35.6'

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --region us-east-1 --name voting-app-cluster

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Verify deployments
        run: |
          kubectl rollout status deployment/vote --timeout=180s
          kubectl rollout status deployment/result --timeout=180s
          kubectl rollout status deployment/worker --timeout=180s
